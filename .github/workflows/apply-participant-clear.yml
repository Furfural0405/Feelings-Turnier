name: Apply participant clear admin feature

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-participant-clear.yml'
      - 'scripts/apply_participant_clear.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "participant-clear-patch"
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Apply participant clear patch
        run: python scripts/apply_participant_clear.py

      - name: Commit patched App
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Funktion ist bereits eingebaut."
          else
            git commit -m "Add clear all participants admin action"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger normal Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/static.yml/dispatches \
            -d '{"ref":"main"}'
