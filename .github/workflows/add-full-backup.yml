name: Add full tournament backup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-full-backup.yml'
      - 'scripts/add_full_backup.py'
      - 'supabase/full_backup_restore.sql'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  patch-build-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      VITE_SUPABASE_URL: https://rwmzxgnbndoeioqksnyn.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_REhjSoFql5jeIPjI3mBwmw_zCjDuSAv

    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Apply full backup upgrade
        run: python scripts/add_full_backup.py

      - name: Verify backup markers
        run: |
          grep -q "feelings-tournament-backup" src/App.tsx
          grep -q "restore_tournament_backup" src/App.tsx
          grep -q "Vollbackup exportieren" src/App.tsx

      - name: Commit upgraded App
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo "Vollbackup-Funktion ist bereits eingebaut."
          else
            git commit -m "Add complete tournament backup and restore"
            git push origin HEAD:main
          fi

      - name: Re-sync committed main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Configure npm registry
        run: npm config set registry https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Build website
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload built website
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy upgraded website
        id: deployment
        uses: actions/deploy-pages@v5
