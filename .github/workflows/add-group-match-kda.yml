name: Add group match KDA

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-group-match-kda.yml'
      - 'scripts/add_group_match_kda.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "group-match-kda-patch"
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: https://rwmzxgnbndoeioqksnyn.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_REhjSoFql5jeIPjI3mBwmw_zCjDuSAv

    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Apply group match KDA
        run: python scripts/add_group_match_kda.py

      - name: Verify feature markers
        run: |
          grep -q "stats?: Record<string, ParticipantStats>" src/types.ts
          grep -q "matchKdaRounds" src/lib/tournament.ts
          grep -q "updateGroupMatchStat" src/App.tsx
          grep -q "aufsummierte Match-KDA" src/App.tsx

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Configure npm registry
        run: npm config set registry https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Build website
        run: npm run build

      - name: Commit tested changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/types.ts src/lib/tournament.ts src/styles.css
          if git diff --cached --quiet; then
            echo "Match-KDA ist bereits eingebaut."
          else
            git commit -m "Add per-match team KDA to group stage"
            git push origin HEAD:main
          fi

      - name: Trigger normal Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 3
          curl --fail-with-body             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/actions/workflows/static.yml/dispatches"             -d '{"ref":"main"}'
