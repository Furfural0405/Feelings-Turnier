name: Apply KDA weighting update

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/apply_kda_weighting.py'
      - '.github/workflows/apply-kda-weighting.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Apply KDA weighting patch
        run: python scripts/apply_kda_weighting.py

      - name: Commit KDA admin UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/types.ts src/lib/scoring.ts src/lib/tournament.ts supabase/setup.sql
          if git diff --cached --quiet; then
            echo "KDA-Gewichtung ist bereits vollständig eingebaut."
            exit 0
          fi
          git commit -m "Add KDA weighting admin controls"
          git push origin HEAD:main
