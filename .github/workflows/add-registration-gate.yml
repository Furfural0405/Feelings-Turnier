name: Add tournament registration gate

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-registration-gate.yml'
      - 'scripts/add_registration_gate.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "registration-gate-patch-v2"
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: https://rwmzxgnbndoeioqksnyn.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_REhjSoFql5jeIPjI3mBwmw_zCjDuSAv

    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Apply registration gate V2
        run: python scripts/add_registration_gate.py

      - name: Verify feature markers
        run: |
          grep -q "registrationEnabled" src/types.ts
          grep -q "registrationEnabled: true" src/lib/tournament.ts
          grep -q "set_tournament_registration_enabled" src/App.tsx
          grep -q "ANMELDUNG GESCHLOSSEN" src/App.tsx
          grep -q "Anmeldung automatisch geschlossen" src/App.tsx

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Configure npm registry
        run: npm config set registry https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Build website
        run: npm run build

      - name: Commit tested changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/types.ts src/styles.css src/lib/tournament.ts
          if git diff --cached --quiet; then
            echo "Anmeldeschalter V2 ist bereits eingebaut."
          else
            git commit -m "Fix and add tournament registration gate"
            git push origin HEAD:main
          fi

      - name: Wait for pushed main
        run: sleep 3

      - name: Trigger normal Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/actions/workflows/static.yml/dispatches"             -d '{"ref":"main"}'
