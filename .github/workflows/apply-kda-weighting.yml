name: Apply KDA weighting update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Apply KDA weighting patch
        run: python scripts/apply_kda_weighting.py

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/types.ts src/lib/scoring.ts src/lib/tournament.ts supabase/setup.sql
          if git diff --cached --quiet; then
            echo "Keine Änderungen notwendig."
            exit 0
          fi
          git commit -m "Add configurable KDA scoring weights"
          git push origin HEAD:main
